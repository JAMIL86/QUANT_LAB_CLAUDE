[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Quant Lab — sistema quantitativo (F0-F4, R1 PENDENTE)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Quant Lab" },
]
dependencies = [
    # Core
    "pydantic>=2.5",
    "typer>=0.9",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "duckdb>=1.0",
    "joblib>=1.3",
    "pyarrow>=14",
    "hypothesis>=6.9",
    # Stats / validation
    "statsmodels>=0.14",
    "arch>=5.5",
    "numba>=0.60",
    # Data
    "polars>=0.20",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "lxml>=4.9",
    "beautifulsoup4>=4.12",
    # PDF / OCR
    "pymupdf>=1.23",
    "pdfplumber>=0.11",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    # Charts / reports
    "plotly>=5.18",
    "jinja2>=3.1",
    # HTTP
    "httpx>=0.27",
    # UI
    "streamlit>=1.30",
    # Testing / linting
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

[project.optional-dependencies]
# Opcionais — instalar sob aprovação (R9: >500 MB)
# vectorbt: triagem vetorial (pesado)
# rapidocr: OCR ONNX CPU (~200 MB)
vectorbt = ["vectorbt>=0.26"]
ocr = ["onnxruntime>=1.17", "rapidocr-onnxruntime>=1.3"]
mt5 = ["MetaTrader5>=5.0"]  # Windows only

[project.scripts]
quantlab = "quantlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "work"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true